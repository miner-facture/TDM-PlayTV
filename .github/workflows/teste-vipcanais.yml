
name: TDM PlayTV Pro - Teste VipCanais

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar Playwright
        run: npm install --no-save playwright

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificar Secrets
        env:
          VIPCANAIS_USER: ${{ secrets.VIPCANAIS_USER }}
          VIPCANAIS_PASSWORD: ${{ secrets.VIPCANAIS_PASSWORD }}
        run: |
          node -e "if (!process.env.VIPCANAIS_USER || !process.env.VIPCANAIS_PASSWORD) process.exit(1); console.log('Credenciais configuradas')"

      - name: Testar navegador
        run: |
          node -e "const {chromium}=require('playwright'); (async()=>{const b=await chromium.launch({headless:true}); try {const p=await b.newPage(); const r=await p.goto('https://vipcanais.net/minha-conta/',{timeout:30000}); console.log('HTTP:',r.status()); console.log('Titulo:',await p.title());} finally {await b.close();}})().catch(()=>{console.error('Falha no acesso');process.exitCode=1})"
