name: TDM PlayTV Pro - Atualizador

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atualizar-catalogo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AUTHORIZED_CHANNEL_IDS: ${{ vars.AUTHORIZED_CHANNEL_IDS }}

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validar catalogo
        run: |
          node -e "const c = require('./catalog.json'); if (!Array.isArray(c.liveChannels)) process.exit(1); console.log('Canais:', c.liveChannels.length)"

      - name: Executar atualizador
        run: node scripts/atualizar_canais.js
